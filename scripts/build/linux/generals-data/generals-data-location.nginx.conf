# GeneralsX @feature Android network build 30/09/2026 Dedicated static archives.
# Candidate snippet for kinotrack.uz's HTTPS server, subject to route review.
# The generals_download_json format must exist at the http level first.
location ^~ /generals-files/ {
    alias /srv/generalszh-android-network/public/;
    autoindex off;
    disable_symlinks on;
    max_ranges 1;
    # At most four simultaneous responses at 3,000,000 bytes/s each:
    # 96 Mbit/s of payload, leaving room within the user's 100 Mbit/s budget.
    # This bounds sustained payload throughput, not instantaneous wire-level bursts.
    limit_conn generals_download_total 4;
    limit_conn_status 429;
    limit_rate 3000000;
    limit_rate_after 0;
    gzip off;
    default_type application/octet-stream;
    access_log /srv/generalszh-android-network/logs/downloads.jsonl
        generals_download_json buffer=32k flush=5s;
    error_log /srv/generalszh-android-network/logs/nginx-error.log warn;
    limit_except GET HEAD { deny all; }
}
