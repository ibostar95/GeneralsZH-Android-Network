# GeneralsX @feature Android network build 30/09/2026 Dedicated transfer log.
# Include at nginx's http level. The download location must explicitly select
# this format and its own log path. No addresses, queries, or credentials are logged.
log_format generals_download_json escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"completed":"$request_completion"}';

# Only the Generals location uses this zone; other project traffic is unaffected.
limit_conn_zone $server_name zone=generals_download_total:64k;
