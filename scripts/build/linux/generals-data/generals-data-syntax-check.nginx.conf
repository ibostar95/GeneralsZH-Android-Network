# Syntax test only: nginx -t -c <this-file>. Never start a server with this file.
pid /srv/generalszh-android-network/nginx-syntax.pid;
error_log /srv/generalszh-android-network/logs/syntax-error.log warn;
events { worker_connections 64; }
http {
    include /etc/nginx/mime.types;
    include /srv/generalszh-android-network/config/generals-download-log.nginx.conf;
    server {
        listen 127.0.0.1:18888;
        server_name generals-syntax-check.invalid;
        include /srv/generalszh-android-network/config/generals-data-location.nginx.conf;
    }
}
